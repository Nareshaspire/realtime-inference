[project]
name = "realtime-inference"
version = "0.1.0"
description = "Real-time multi-domain inference engine with trained model registry, streaming, and API service"
readme = "README.md"
authors = [
    { name = "nareshaspire", email = "nareshaspire45@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "scikit-learn>=1.5.2",
    "joblib>=1.4.2",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
realtime-inference = "realtime_inference:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-v --strict-markers"
